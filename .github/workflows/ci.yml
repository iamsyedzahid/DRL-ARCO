name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          python scripts/gen_proto.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  ns3:
    # Compiles the real C++ scenario and runs it against the Python bridge.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build ns-3 with the scenario
        run: bash scripts/install_ns3.sh "$HOME/ns-allinone"
      - name: Install Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: End-to-end check
        run: NS3_HOME="$HOME/ns-allinone/ns-3.40" bash scripts/check_ns3.sh
